[paths]
# READ-ONLY INPUT. Default Vita3K installed-game directory in Batocera.
# The program only scans/stats/reads this tree; it never modifies it.
source = /userdata/saves/psvita/ux0/app

# WRITABLE OUTPUT. Batocera's PS Vita launcher directory.
# The utility refuses ANY writable path anywhere under /userdata/saves/psvita.
output = /userdata/roms/psvita

database = /userdata/system/psvita_launcher/title_ids.tsv
unknown_log = /userdata/system/psvita_launcher/unmatched_title_ids.txt
lock_file = /userdata/system/psvita_launcher/psvita_launcher.lock

# Small persistent state files used to make large-library scans safer/faster.
managed_state = /userdata/system/psvita_launcher/managed_launchers.tsv
title_cache = /userdata/system/psvita_launcher/title_cache.tsv

[behavior]
# Keep false for Vita3K: installed games are top-level ux0/app/TITLE_ID folders.
# Recursive scanning would waste I/O walking the contents of every installed game.
recursive = false

# UPDATE GAMELISTS stays local and never waits on GitHub by default.
auto_update_database = false
db_max_age_days = 30

# Existing launcher names are preserved unless you explicitly opt into renaming.
rename_existing_launchers = false

# OFF BY DEFAULT. When enabled, cleanup only deletes stale launchers that this
# utility previously created and still tracks in managed_launchers.tsv. It also
# refuses to delete symlinks, non-.psvita files, or files that are no longer
# zero bytes. Vita3K itself is never modified by cleanup.
cleanup_stale_launchers = false

# Batocera's documented format supports "Game Name (USA) [TITLEID].psvita".
include_region = true

# Prefer the installed game's own sce_sys/param.sfo title. For a large library
# this is more complete than relying on a compatibility database.
prefer_local_sfo = true

# Cache the title from each unchanged PARAM.SFO. On later gamelist refreshes the
# utility normally stats the small SFO file but does not reopen/reparse it.
cache_local_sfo = true
