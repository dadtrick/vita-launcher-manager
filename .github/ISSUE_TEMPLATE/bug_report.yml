name: Bug report
description: Report a reproducible Vita Launcher Manager defect
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This project does not provide Vita3K game compatibility or game/firmware support.
        Before filing a bug, run the built-in support report.
  - type: textarea
    id: report
    attributes:
      label: Support report
      description: Paste the complete output of `python3 -S /userdata/system/psvita_launcher/psvita_launcher.py support-report`.
      render: shell
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest exact sequence that reproduces the problem.
      placeholder: |
        1. Install a Vita title...
        2. Choose UPDATE GAMELISTS...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This is a launcher-manager defect, not a Vita3K game compatibility/performance issue.
          required: true
        - label: I am not requesting games, firmware, keys, licenses, or copyrighted content.
          required: true
